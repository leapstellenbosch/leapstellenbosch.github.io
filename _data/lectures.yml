# The LEAP Lecture: one lecture a year since 2016, newest first. Shown on the Lectures page.
# Edit in the browser: see HOW-TO-EDIT-CONTENT.md
#
# number       the lecture's number in the series
# year         the year it was delivered
# date         optional: the exact day, YYYY-MM-DD
# speaker      who delivered it (for a panel, the panel's name)
# affiliation  the speaker's university at the time
# title        the title of the lecture; leave empty if unknown
# note         optional: one line, for example the names of a panel
# video        the YouTube video id (the part after watch?v=), empty until the film is up
# news         optional: the address of the news post about it
# upcoming     true for a lecture that has not happened yet; it is shown at the top of the page
#
# The still for each lecture is assets/img/lectures/<year>.webp, made by
# `python tools/treat-images.py lectures` from the video's thumbnail in _sources/lectures/.

