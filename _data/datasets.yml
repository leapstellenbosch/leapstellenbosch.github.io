  period: "After 1902"
  released: 2026-07-25
  url: https://github.com/johanfourieza/research/tree/main/2026/sac
  doi:
  licence: CC BY 4.0

- paper: "Uprooted: Migration, Coercion, and the Roots of Social Connectedness"
  authors:
    - "Fourie, Johan"
  outlet:
