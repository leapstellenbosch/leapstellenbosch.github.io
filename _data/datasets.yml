# The data index on the Data page: one entry per paper whose data are public on GitHub.
# Edit in the browser: see HOW-TO-EDIT-CONTENT.md
# Only list data that can be downloaded now. Nothing forthcoming.
#
# paper     the title of the paper the data belong to
# authors   one line per author, surname first: "Fourie, Johan"
# outlet    optional: the journal, with (forthcoming) if not yet out. Leave empty for a working paper
# data      one line: what the package holds
# period    the years the data cover
# released  the date the data went public, YYYY-MM-DD
# url       the GitHub repository (or folder) with the data
# doi       optional: the Zenodo DOI of the release, without https://doi.org/
# licence   usually CC BY 4.0
# TODO Johan: move the repositories into github.com/leapstellenbosch and add DOIs.

- paper: "Demographic Pressure, Emancipation and Selection into the Great Trek"
  authors:
    - "Fourie, Johan"
    - "Links, Calumet"
  outlet: European Review of Economic History (forthcoming)
  data: Voortrekker genealogies linked to the 1825 Cape census and the 1833–34 slave compensation records
  period: "1825–1840"
  released: 2026-07-25
  url: https://github.com/johanfourieza/research/tree/main/2026/voortrekker
  doi:
  licence: CC BY 4.0

- paper: "A Disease Never Seen Here: Measuring the Severity of the 1713 Smallpox Epidemic at the Cape"
  authors:
    - "Fourie, Johan"
  outlet:
  data: Settler and slave counts from the tax censuses, probate inventories by year, and 7,670 labelled entries from the Company's daily journal
  period: "1700–1720"
  released: 2026-07-25
  url: https://github.com/johanfourieza/research/tree/main/2026/1713smallpox
  doi:
  licence: CC BY 4.0

- paper: "Discrimination After Hiring: Within-Firm Sorting, Slow Employer Learning, and the Cost to the Sorted Worker"
  authors:
    - "Fourie, Johan"
    - "Inwood, Kris"
    - "Mariotti, Martine"
  outlet:
