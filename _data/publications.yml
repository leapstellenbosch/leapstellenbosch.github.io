# LEAP publications. Edit in the browser: see HOW-TO-EDIT-CONTENT.md
# Order: journal articles first, then working papers; newest first within each.
# Only economic history papers by LEAP team members belong here. Two kinds of entry, set by `type:`.
#
# 1. Working paper (type: working_paper) carries series, number and a PDF url:
#
#    - title: "Full title of the paper"
#      authors: [First Surname, First Surname]
#      year: 2026
#      type: working_paper
#      series: Stellenbosch Economic Working Papers
#      number: WP06/2026
#      url: https://www.ekon.sun.ac.za/wpapers/2026/wp062026/wp062026.pdf
#
# 2. Journal article (type: article) carries journal and doi instead;
#    its url is https://doi.org/ followed by the doi, or the journal's page
#    for the article if it has no doi (then leave doi: empty):
#
#    - title: "Full title of the article"
#      authors: [First Surname, First Surname]
#      year: 2026
#      type: article
#      journal: Name of the Journal
#      doi: 10.1111/aehr.70034
#      url: https://doi.org/10.1111/aehr.70034
#
# Rules: two spaces of indentation, never tabs. Always wrap the title in
# double quotes. Separate authors with commas and write each name as
# First Surname; a name must not contain a comma (write Frank W. Garmon Jr.).

