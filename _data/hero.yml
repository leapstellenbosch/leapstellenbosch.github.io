# The archival sources behind the four letters on the home page.
# Each visit draws one source at random for every letter; the caption appears
# when a visitor points at (or taps) the letter. The first entry of each letter
# is the one shown if a browser has JavaScript switched off.
#
# image    file name in assets/img/hero/, without .webp. The files are made by
#          tools/treat-images.py (see the HERO list there), which tints each
#          source in its letter's colour. To add a source, add it there, run
#          `python tools/treat-images.py hero`, then add a line here.
# caption  one short line, no full stop. Give the archive reference where there is one.
#
# L maps · E photographs · A handwriting · P printed records
# A letter may have any number of sources. Origins are recorded in _sources/hero/SOURCES.md.
# TODO Johan: check the captions.

l:
  - image: l-free-state-map
    caption: Map of the Orange Free State and Transvaal
  - image: l-africa-de-wit
    caption: Frederick de Wit's map of Africa, c. 1660
  - image: l-africa-1578
    caption: The equatorial lakes of Africa after Pigafetta, Rome 1591 (Western Cape Archives, E4430)
  - image: l-cape-town-1897
    caption: Plan of Cape Town, 1897
  - image: l-cadastral-albert
    caption: Cadastral map of the division of Albert, c. 1890

e:
