name: Laboratory for the Economics of Africa's Past
short_name: LEAP
email: leap@sun.ac.za
director: Prof. Johan Fourie

headline: "Africa's economic past, measured."
mission: >-
  The Laboratory for the Economics of Africa's Past (LEAP) is dedicated to the
  quantitative study of African economic and social history. It brings together
  scholars and students interested in understanding and explaining the long-term
  economic development of Africa's diverse societies.
founding: >-
  Established in 2015 in the Department of Economics, Stellenbosch University.
  A Type-1 research centre since 2023.
values: "Creativity, courage, credibility, collaboration, compassion."
founded: 2015

quote:
  text: >-
    No man can know where he is going unless he knows exactly where he has been
    and exactly how he arrived at his present place.
  by: Maya Angelou, 1972

